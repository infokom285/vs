<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн-приёмная — Infokomvostok</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #1e1e2f;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #2d3436;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #00d2ff;
        }
        h1 { margin: 0; font-size: 20px; font-weight: 300; }
        #video-container {
            flex-grow: 1;
            background: #000;
            position: relative;
        }
        .controls {
            padding: 20px;
            text-align: center;
            background: #2d3436;
        }
        .btn-close {
            padding: 10px 25px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>ОНЛАЙН-ПРИЁМНАЯ INFOKOMVOSTOK</h1>
</header>

<div id="video-container">
    </div>

<div class="controls">
    <p>Сообщите собеседнику название комнаты: <b id="room-name">InfokomVostok_Room</b></p>
    <button class="btn-close" onclick="window.close()">Завершить вызов</button>
</div>

<script src='https://meet.jit.si/external_api.js'></script>
<script>
    const domain = 'meet.jit.si';
    const options = {
        roomName: 'InfokomVostok_Reception_' + Math.floor(Math.random() * 1000), // Случайный ID для приватности
        width: '100%',
        height: '100%',
        parentNode: document.querySelector('#video-container'),
        lang: 'ru',
        interfaceConfigOverwrite: {
            TOOLBAR_BUTTONS: [
                'microphone', 'camera', 'closedcaptions', 'desktop', 'fullscreen',
                'fodeviceselection', 'hangup', 'profile', 'chat', 'recording',
                'livestreaming', 'etherpad', 'sharedvideo', 'settings', 'raisehand',
                'videoquality', 'filmstrip', 'invite', 'feedback', 'stats', 'shortcuts',
                'tileview', 'videobackgroundblur', 'download', 'help', 'mute-everyone'
            ],
        }
    };
    const api = new JitsiMeetExternalAPI(domain, options);
    
    // Выводим имя комнаты для приглашения
    document.getElementById('room-name').innerText = options.roomName;
</script>

</body>
</html>
