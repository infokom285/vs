<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon_iva.ico" type="image/x-icon">
    <title>Мой рабочий кабинет</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1e1e2f 0%, #2d3436 100%);
            color: white;
        }
        
        h1 { margin-bottom: 40px; font-weight: 300; letter-spacing: 2px; }

        /* Сетка 2х2 */
        .container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 25px; 
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 15px;
            text-align: center;
            width: 240px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-decoration: none;
            color: white;
        }

        .card:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: #00d2ff;
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 8px rgba(0,210,255,0.4));
        }

        h2 { margin: 10px 0; font-size: 20px; font-weight: 400; }
        small { color: #aaa; }

        /* Адаптивность для мобилок */
        @media (max-width: 600px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<h1>РАБОЧИЙ КАБИНЕТ</h1>

<div class="container">
    <div class="card" onclick="openSite('https://infokom285.github.io/vostok85/index.html')">
        <img src="https://cdn-icons-png.flaticon.com/512/3426/3426631.png" alt="Math">
        <h2>Математика</h2>
        <small>Перейти к сайту</small>
    </div>

    <div class="card" onclick="openSite('https://infokom285.github.io/vostok280/index.html')">
        <img src="https://cdn-icons-png.flaticon.com/512/2830/2830305.png" alt="Gov">
        <h2>Гос. услуги</h2>
        <small>Перейти к сайту</small>
    </div>

    <div class="card" onclick="openSite('https://infokom285.github.io/vostok/index.html')">
        <img src="https://cdn-icons-png.flaticon.com/512/2092/2092663.png" alt="Site 3">
        <h2>Запчасти</h2>
        <small>Сайт в рублях</small>
    </div>

    <div class="card" onclick="openSite('https://infokom285.github.io/vostok280/index.html')">
        <img src="https://cdn-icons-png.flaticon.com/512/3144/3144456.png" alt="Site 4">
        <h2>Инфоком</h2>
        <small>Сайт в евро</small>
    </div>
</div>

<script>
    function openSite(url) {
        // Просто открываем сайт, ничего не удаляя из памяти
        window.open(url, '_blank');
    }
</script>

</body>
</html>
