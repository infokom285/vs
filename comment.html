<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн-приёмная — Infokomvostok</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1e1e2f; font-family: Arial, sans-serif; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #2d3436; padding: 10px 20px; text-align: center; border-bottom: 2px solid #00d2ff; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 18px; font-weight: 300; }
        
        /* Стили индикатора */
        #status-indicator { 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: bold; 
            background: #444; 
            transition: 0.5s;
        }
        .status-wait { color: #aaa; border: 1px solid #666; }
        .status-active { color: #fff; background: #28a745 !important; border: 1px solid #fff; box-shadow: 0 0 10px #28a745; }

        #video-container { flex-grow: 1; background: #000; }
        .footer-controls { padding: 15px; background: #2d3436; text-align: center; display: flex; justify-content: center; gap: 20px; align-items: center; }
        .btn { padding: 8px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-copy { background: #007bff; color: white; }
        .btn-copy:hover { background: #0056b3; }
        .btn-close { background: #dc3545; color: white; }
    </style>
</head>
<body>

<header>
    <h1>ОНЛАЙН-ПРИЁМНАЯ INFOKOMVOSTOK</h1>
    <div id="status-indicator" class="status-wait">ОЖИДАНИЕ ГОСТЯ</div>
</header>

<div id="video-container"></div>

<div class="footer-controls">
    <button class="btn btn-copy" onclick="copyLink()">📋 Копировать ссылку для гостя</button>
    <button class="btn btn-close" onclick="window.close()">Завершить вызов</button>
</div>

<script src='https://meet.jit.si/external_api.js'></script>
<script>
    const ROOM_NAME = 'InfokomVostok_Official_Reception'; 
    const domain = 'meet.jit.si';
    
    const options = {
        roomName: ROOM_NAME,
        width: '100%',
        height: '100%',
        parentNode: document.querySelector('#video-container'),
        lang: 'ru',
        interfaceConfigOverwrite: {
            TOOLBAR_BUTTONS: ['microphone', 'camera', 'chat', 'desktop', 'fullscreen', 'hangup', 'tileview']
        }
    };
    
    const api = new JitsiMeetExternalAPI(domain, options);
    const statusBox = document.getElementById('status-indicator');

    // Событие: кто-то зашел в комнату
    api.addEventListener('participantJoined', (event) => {
        statusBox.innerText = "ГОСТЬ В СЕТИ";
        statusBox.className = "status-active";
        // Можно добавить проигрывание короткого "бип", если нужно
    });

    // Событие: кто-то вышел
    api.addEventListener('participantLeft', (event) => {
        // Проверяем, остались ли еще люди (кроме вас)
        const participants = api.getParticipantsInfo();
        if (participants.length <= 1) {
            statusBox.innerText = "ОЖИДАНИЕ ГОСТЯ";
            statusBox.className = "status-wait";
        }
    });

    function copyLink() {
        const url = `https://meet.jit.si/${ROOM_NAME}`;
        navigator.clipboard.writeText(url).then(() => {
            alert("Ссылка скопирована! Отправьте её собеседнику.");
        });
    }
</script>
</body>
</html>
